<!DOCTYPE html>
<html lang="pt-BR">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="login.css">
    <title>Barra</title>
</head>
<body>
        <div id="logo" class="logo">
                <a href="inicial.html"><img id="imgLogo" class="imgLogo" src="IMG/FAÇA SEU LOGIN.png" alt="logo"></a>
                <a href="login.html"><button id="botao-perfil" class="botao-perfil"><img class="perfilImg" src="IMG/perfil.png" alt=""></button></a>
                <a href="carrinho.html"><button id="botao-sacola" class="botao-sacola"><img class="sacolaImg" src="IMG/sacola.png" alt=""></button></a>
                <a href="favoritos.html"><button id="boatao-favorito" class="botao-favorito"><img class="favoritoImg" src="IMG/favoritos.png" alt=""></button></a>
        </div>

    <header>
    </header>

    <main>
        <div id="login-container" class="login-container">
            <div id="titulo-container" class="titulo-container">
                <h1>Faça seu login</h1>
            </div>
            <hr id="linha-titulo" class="linha-titulo"/>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <div id="senha-container" class="senha-container">
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                <a href="redefinir.html" id="esqueceu-link" class="esqueceu-link">Esqueceu?</a>
            </div>


            
            <button class="botao-enviar" type="submit">Enviar</button>
            <div id="link-esqueci-senha" class="link-esqueci-senha"></div>
        </div>

        <div id="divider" class="divider">
            <hr>
            <span>ou</span>
            <hr>
        </div>

        <div id="social-buttons" class="social-buttons">
            <button id="social-btn" class="social-btn google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
                <script src="https://apis.google.com/js/platform.js" async defer></script>
                <span>Google</span>
            </button>

            <button id="social-btn" class="social-btn facebook-btn">
                <img src="logoFacebook.png" alt="Facebook logo">
                <span>Facebook</span>
            </button>
        </div>

        <div>
            <p id="link-cadastro" class="link-cadastro">
                Não tem conta? <a href="cadastro.html">Cadastre-se</a> <br>
                <br>
                Ache a sua conta <a href="achesuaconta.html">aqui</a>
            </p>
        </div>
    </main>

    <script src="./Arquivos.js/login.js"></script>
</body>
</html>
